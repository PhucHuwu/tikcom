<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TikCom" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <title>TikCom · Trợ lý livestream</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Tik<span>Com</span></div>
      <form id="connect-form" class="connect">
        <input id="username" type="text" placeholder="@username TikTok" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button type="submit" id="btn-connect" class="btn primary">Kết nối</button>
        <button type="button" id="btn-demo" class="btn ghost">Demo</button>
        <button type="button" id="btn-disconnect" class="btn danger" hidden>Ngắt</button>
      </form>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Chưa kết nối</span></div>
      <button id="btn-sound" class="btn sound off" type="button" title="Bật/tắt âm thanh TTS">🔇 Bật âm thanh</button>
    </header>

    <div class="kpis" id="kpis"></div>

    <nav class="tabs" id="tabs">
      <button data-tab="live" class="active">💬 Live</button>
      <button data-tab="stats">📊 Thống kê</button>
      <button data-tab="history">🗂 Lịch sử</button>
      <button data-tab="settings">⚙️ Cài đặt</button>
    </nav>

    <main>
      <section id="tab-live" class="tab active">
        <div class="live-grid">
          <div class="panel feed-panel">
            <div class="panel-head">
              <h2>Bình luận</h2>
              <div class="filters">
                <label><input type="checkbox" id="f-foreign" /> Chỉ nước ngoài</label>
                <label><input type="checkbox" id="f-joins" /> Người vào</label>
              </div>
            </div>
            <div id="feed" class="feed"></div>
            <button id="btn-jump" class="jump" hidden>↓ Bình luận mới</button>
          </div>

          <div class="panel reply-panel" id="reply-panel">
            <div class="panel-head">
              <h2>Gợi ý trả lời</h2>
              <label class="follow-toggle"><input type="checkbox" id="auto-follow" checked /> Tự nhảy tới comment mới</label>
              <button class="btn ghost close-sheet" id="btn-close-sheet" type="button">Đóng</button>
            </div>
            <div id="reply" class="reply"></div>
          </div>
        </div>
      </section>

      <section id="tab-stats" class="tab">
        <div id="stats" class="stats-grid"></div>
      </section>

      <section id="tab-history" class="tab">
        <div class="history">
          <div class="panel">
            <div class="panel-head"><h2>Các buổi live</h2><button class="btn ghost" id="btn-refresh-history" type="button">Làm mới</button></div>
            <div id="sessions" class="sessions"></div>
          </div>
          <div class="panel" id="session-detail"><p class="muted pad">Chọn một buổi live để xem báo cáo.</p></div>
        </div>
      </section>

      <section id="tab-settings" class="tab">
        <form id="settings-form" class="panel settings">
          <h2>Gợi ý trả lời</h2>
          <label class="row">
            <span>Chế độ phân tích comment nước ngoài</span>
            <select name="suggestMode">
              <option value="auto">Tự động (mọi comment nước ngoài)</option>
              <option value="manual">Thủ công (chỉ khi bấm vào comment)</option>
            </select>
          </label>
          <label class="col">
            <span>Thông tin về bạn / kênh (giúp AI trả lời đúng hơn)</span>
            <textarea name="channelInfo" rows="4" placeholder="Ví dụ: Mình tên Linh, 25 tuổi, sống ở Đà Nẵng. Kênh bán quần áo nữ, live 8h tối mỗi ngày."></textarea>
          </label>

          <h2>Tự động cảm ơn (đọc bằng giọng Google)</h2>
          <label class="row"><span>Cảm ơn khi được tặng quà</span><input type="checkbox" name="thankGifts" /></label>
          <label class="row"><span>Chỉ cảm ơn khi tổng giá trị quà từ (kim cương)</span><input type="number" name="minDiamonds" min="0" step="1" /></label>
          <label class="col"><span>Câu cảm ơn quà — dùng {name}, {count}, {gift}</span><input type="text" name="giftTemplate" /></label>
          <label class="row"><span>Cảm ơn khi có người theo dõi</span><input type="checkbox" name="thankFollows" /></label>
          <label class="col"><span>Câu cảm ơn theo dõi — dùng {name}</span><input type="text" name="followTemplate" /></label>
          <label class="row"><span>Cảm ơn khi có người chia sẻ</span><input type="checkbox" name="thankShares" /></label>
          <label class="col"><span>Câu cảm ơn chia sẻ — dùng {name}</span><input type="text" name="shareTemplate" /></label>

          <h2>Âm thanh</h2>
          <label class="row"><span>Âm lượng</span><input type="range" id="volume" min="0" max="1" step="0.05" /></label>
          <div class="row">
            <span>Thử giọng đọc</span>
            <button class="btn ghost" type="button" id="btn-test-voice">▶ Phát thử</button>
          </div>
          <p class="muted">Âm thanh phát ra từ loa của máy này. Đặt loa gần iPhone đang livestream để micro thu vào buổi live.</p>
          <div class="actions"><span id="settings-saved" class="muted"></span><button class="btn primary" type="submit">Lưu cài đặt</button></div>
        </form>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
